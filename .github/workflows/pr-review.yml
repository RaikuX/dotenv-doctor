name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check API key
        id: keycheck
        run: |
          if [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - uses: actions/checkout@v4
        if: steps.keycheck.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex review
        if: steps.keycheck.outputs.present == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pr-review.md
          sandbox: read-only
          safety-strategy: drop-sudo
          effort: medium

      - name: Post review comment
        if: steps.keycheck.outputs.present == 'true' && steps.codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ steps.codex.outputs.final-message }}
        run: gh pr comment "$PR_NUMBER" --body "$BODY"
